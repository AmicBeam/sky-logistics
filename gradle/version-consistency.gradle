import groovy.json.JsonSlurper

def supportedVersions = ['1.20.1', '1.21.1', '26.1.2']
def repositoryRoot = project.projectDir.toPath().resolve('../..').normalize().toFile()
def versionRoot = { String version -> new File(repositoryRoot, "versions/${version}") }

def registeredIds = { String version ->
    def ids = [] as Set
    fileTree(new File(versionRoot(version), 'src/main/java/com/skylogistics/registry')) {
        include '*.java'
    }.files.each { source ->
        (source.getText('UTF-8') =~ /(?s)\.register\(\s*"([^"]+)"/).each { match ->
            ids.add(match[1])
        }
    }
    ids
}

def configKeys = { String version ->
    def source = new File(versionRoot(version),
            'src/main/java/com/skylogistics/config/SkyLogisticsConfig.java').getText('UTF-8')
    def keys = [] as Set
    (source =~ /(?s)\.define(?:InRange)?\(\s*"([^"]+)"/).each { match ->
        keys.add(match[1])
    }
    keys
}

def recipeIds = { String version ->
    def dataRoot = new File(versionRoot(version), 'src/main/resources/data/skylogistics')
    def ids = [] as Set
    ['recipe', 'recipes'].each { directory ->
        fileTree(new File(dataRoot, directory)) {
            include '**/*.json'
        }.files.each { recipe ->
            ids.add(new File(dataRoot, directory).toPath().relativize(recipe.toPath()).toString())
        }
    }
    ids
}

def translationKeys = { String version, String language ->
    def languageFile = new File(versionRoot(version),
            "src/main/resources/assets/skylogistics/lang/${language}.json")
    (new JsonSlurper().parse(languageFile) as Map).keySet() as Set
}

def recipeText = { String version ->
    def dataRoot = new File(versionRoot(version), 'src/main/resources/data/skylogistics')
    ['recipe', 'recipes'].collectMany { directory ->
        fileTree(new File(dataRoot, directory)) {
            include '**/*.json'
        }.files
    }.collect { it.getText('UTF-8') }.join('\n')
}

def modVersion = { String version ->
    def properties = new Properties()
    new File(versionRoot(version), 'gradle.properties').withInputStream { properties.load(it) }
    properties.getProperty('mod_version')
}

def assertSameKeys = { String label, Set expected, Set actual, String version ->
    def missing = (expected - actual).sort()
    def extra = (actual - expected).sort()
    if (!missing.isEmpty() || !extra.isEmpty()) {
        throw new GradleException(
                "${label} differs in ${version}; missing=${missing}, extra=${extra}")
    }
}

tasks.register('checkVersionConsistency') {
    group = 'verification'
    description = 'Checks gameplay-facing IDs and localization keys across supported versions.'

    inputs.files(supportedVersions.collectMany { version ->
        fileTree(new File(versionRoot(version), 'src/main')) {
            include 'java/com/skylogistics/registry/*.java'
            include 'java/com/skylogistics/config/SkyLogisticsConfig.java'
            include 'resources/assets/skylogistics/lang/*.json'
            include 'resources/data/skylogistics/recipe/**/*.json'
            include 'resources/data/skylogistics/recipes/**/*.json'
        }.files
    } + supportedVersions.collect { version ->
        new File(versionRoot(version), 'gradle.properties')
    })

    doLast {
        def baseline = supportedVersions.first()
        def baselineRegistrations = registeredIds(baseline)
        def baselineRecipes = recipeIds(baseline)
        def versionSpecificConfigKeys = ['allowBeyondDimensionsManaTransfer'] as Set
        def baselineConfig = configKeys(baseline) - versionSpecificConfigKeys
        def baselineTranslations = translationKeys(baseline, 'en_us')
        def baselineModVersion = modVersion(baseline)
        def ingredientTags = [
                '1.20.1': [
                        chests: 'forge:chests/wooden',
                        glass: 'forge:glass/colorless',
                        amethyst: 'forge:gems/amethyst',
                        lapis: 'forge:gems/lapis',
                        redstoneDust: 'forge:dusts/redstone',
                        redstoneBlock: 'forge:storage_blocks/redstone',
                        woodenRod: 'forge:rods/wooden',
                        diamond: 'forge:gems/diamond',
                        glowstoneDust: 'forge:dusts/glowstone',
                        goldIngot: 'forge:ingots/gold'
                ],
                '1.21.1': [
                        chests: 'c:chests/wooden',
                        glass: 'c:glass_blocks/colorless',
                        amethyst: 'c:gems/amethyst',
                        lapis: 'c:gems/lapis',
                        redstoneDust: 'c:dusts/redstone',
                        redstoneBlock: 'c:storage_blocks/redstone',
                        woodenRod: 'c:rods/wooden',
                        diamond: 'c:gems/diamond',
                        glowstoneDust: 'c:dusts/glowstone',
                        goldIngot: 'c:ingots/gold'
                ],
                '26.1.2': [
                        chests: 'c:chests/wooden',
                        glass: 'c:glass_blocks/colorless',
                        amethyst: 'c:gems/amethyst',
                        lapis: 'c:gems/lapis',
                        redstoneDust: 'c:dusts/redstone',
                        redstoneBlock: 'c:storage_blocks/redstone',
                        woodenRod: 'c:rods/wooden',
                        diamond: 'c:gems/diamond',
                        glowstoneDust: 'c:dusts/glowstone',
                        goldIngot: 'c:ingots/gold'
                ]
        ]
        def replacedVanillaIngredients = [
                'minecraft:chest',
                'minecraft:glass',
                'minecraft:amethyst_shard',
                'minecraft:lapis_lazuli',
                'minecraft:redstone',
                'minecraft:redstone_block',
                'minecraft:stick',
                'minecraft:diamond',
                'minecraft:glowstone_dust',
                'minecraft:gold_ingot'
        ]
        def baselineRecipeText = recipeText(baseline)
        def portableIngredientCounts = ingredientTags[baseline].collectEntries { material, tag ->
            [(material): baselineRecipeText.count(tag)]
        }

        supportedVersions.each { version ->
            assertSameKeys('Registry IDs', baselineRegistrations, registeredIds(version), version)
            assertSameKeys('Recipe IDs', baselineRecipes, recipeIds(version), version)
            assertSameKeys('Config keys', baselineConfig,
                    configKeys(version) - versionSpecificConfigKeys, version)

            def english = translationKeys(version, 'en_us')
            def chinese = translationKeys(version, 'zh_cn')
            assertSameKeys('English translation keys', baselineTranslations, english, version)
            assertSameKeys('Chinese translation keys', baselineTranslations, chinese, version)

            if (modVersion(version) != baselineModVersion) {
                throw new GradleException(
                        "Mod version differs in ${version}; expected=${baselineModVersion}, actual=${modVersion(version)}")
            }

            def recipes = recipeText(version)
            portableIngredientCounts.each { material, expectedCount ->
                def tag = ingredientTags[version][material]
                def actualCount = recipes.count(tag)
                if (actualCount != expectedCount) {
                    throw new GradleException(
                            "Recipe tag ${tag} differs in ${version}; expected=${expectedCount}, actual=${actualCount}")
                }
            }
            replacedVanillaIngredients.each { ingredient ->
                if (recipes.contains("\"${ingredient}\"")) {
                    throw new GradleException(
                            "Recipe ingredient ${ingredient} must use its portable tag in ${version}")
                }
            }
        }
    }
}

tasks.register('checkJeiCompatPackaging') {
    group = 'verification'
    description = 'Checks that the release jar contains the JEI plugin entrypoint.'
    dependsOn tasks.named('jar')

    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def pluginClass = 'com/skylogistics/compat/jei/SkyLogisticsJeiPlugin.class'
            if (zip.getEntry(pluginClass) == null) {
                throw new GradleException("Release jar is missing JEI plugin class: ${pluginClass}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('checkVersionConsistency')
    dependsOn tasks.named('checkJeiCompatPackaging')
}
